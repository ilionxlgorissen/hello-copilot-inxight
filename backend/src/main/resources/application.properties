# Application Name
spring.application.name=hello-copilot-backend

# Server Port
server.port=8080

# Active Profile (default to dev)
spring.profiles.active=dev

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=mySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmToWorkProperly
jwt.expiration=86400000

# WebSocket Configuration
spring.websocket.allowed-origins=http://localhost:3000
